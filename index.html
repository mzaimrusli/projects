<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — Muhammad Zaim Bin Rusli</title>
<style>
  :root {
    --text: #1a1a1a;
    --muted: #595959;
    --accent: #2563eb;
    --border: #e2e2e2;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    max-width: 760px;
    margin: 0 auto;
    padding: 48px 24px 80px;
    line-height: 1.5;
  }
  .back {
    display: inline-block;
    margin-bottom: 24px;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.9rem;
  }
  .back:hover { color: var(--accent); }
  h1 {
    font-size: 1.8rem;
    margin: 0 0 32px;
  }
  .project {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .project h2 {
    font-size: 1.1rem;
    margin: 0 0 6px;
  }
  .project h2 a {
    color: var(--text);
    text-decoration: none;
  }
  .project h2 a:hover { color: var(--accent); }
  .project p {
    color: var(--muted);
    margin: 0 0 10px;
  }
  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tag {
    background: #f3f4f6;
    border-radius: 6px;
    padding: 3px 9px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .empty {
    color: var(--muted);
  }
</style>
</head>
<body>

<a class="back" href="https://mzaimrusli.github.io/resume/">&larr; Resume</a>
<h1>Projects</h1>

</html>
